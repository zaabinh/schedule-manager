spring:
  application:
    name: schedule-manager-backend

  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  jackson:
    time-zone: UTC

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:110MB}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc.core: INFO

  structured:
    format:
      console: logstash

app:
  school-zone: ${SCHOOL_TIME_ZONE:Asia/Ho_Chi_Minh}

  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:5000}

  email:
    provider: ${EMAIL_PROVIDER:log}
    from: ${EMAIL_FROM:no-reply@example.edu.vn}
    web-url: ${EMAIL_WEB_URL:http://localhost:3000}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:3}

  reminder:
    poll-delay-ms: ${REMINDER_POLL_DELAY_MS:60000}
    initial-delay-ms: ${REMINDER_INITIAL_DELAY_MS:60000}
    max-attempts: ${REMINDER_MAX_ATTEMPTS:3}

  task-attachments:
    max-files: ${TASK_ATTACHMENT_MAX_FILES:10}
    max-file-size-bytes: ${TASK_ATTACHMENT_MAX_FILE_SIZE_BYTES:20971520}
    max-total-size-bytes: ${TASK_ATTACHMENT_MAX_TOTAL_SIZE_BYTES:104857600}
    storage: ${FILE_STORAGE_TYPE:local}
    local-root: ${FILE_STORAGE_LOCAL_ROOT:./data/uploads}

  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

    auth-rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:5}
    auth-rate-limit-per-hour: ${AUTH_RATE_LIMIT_PER_HOUR:30}

    cookie-name: ${SESSION_COOKIE_NAME:session}
    cookie-secure: ${SESSION_COOKIE_SECURE:false}

    session-pepper: ${SESSION_PEPPER}

  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    provisioning-mode: ${APP_PROVISIONING_MODE:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Quản trị hệ thống}
    department-name: ${BOOTSTRAP_ADMIN_DEPARTMENT_NAME:Văn phòng}
