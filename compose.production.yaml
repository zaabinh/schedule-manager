services:
  postgres:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backups:/backups
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?required}
      DB_USER: ${POSTGRES_USER:?required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?required}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
      AUTH_RATE_LIMIT_PER_HOUR: ${AUTH_RATE_LIMIT_PER_HOUR:-30}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_ORIGIN:?required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?required}
      SESSION_COOKIE_SECURE: "true"
      SESSION_PEPPER: ${SESSION_PEPPER:?required}
      BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_PROVISIONING_MODE: "false"
      SCHOOL_TIME_ZONE: ${SCHOOL_TIME_ZONE:-Asia/Ho_Chi_Minh}
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: ${EMAIL_FROM:?required}
      SMTP_HOST: ${SMTP_HOST:?required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?required}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      FILE_STORAGE_TYPE: local
      FILE_STORAGE_LOCAL_ROOT: /var/lib/schedule-manager/uploads
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [internal, edge]
    volumes:
      - attachment-data:/var/lib/schedule-manager/uploads

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_ORIGIN:?required}/api/v1
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks: [edge]

networks:
  internal: { internal: true }
  edge: {}

volumes:
  postgres-data: {}
  attachment-data: {}
