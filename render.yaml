services:
  - type: web
    name: schedule-manager-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health/readiness
    maxShutdownDelaySeconds: 60
    disk:
      name: task-attachments
      mountPath: /var/lib/schedule-manager
      sizeGB: 1
    initialDeployHook: >-
      java -XX:MaxRAMPercentage=75 -jar /app/app.jar --server.port=0
      --app.bootstrap-admin.enabled=true
      --app.bootstrap-admin.provisioning-mode=true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: schedule-manager-db
          property: connectionString
      - key: DB_POOL_MAX_SIZE
        value: "10"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "5000"
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: AUTH_RATE_LIMIT_PER_HOUR
        value: "30"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_NAME
        value: __Host-session
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_PEPPER
        generateValue: true
      - key: BOOTSTRAP_ADMIN_ENABLED
        value: "false"
      - key: APP_PROVISIONING_MODE
        value: "false"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_DISPLAY_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_DEPARTMENT_NAME
        sync: false
      - key: SCHOOL_TIME_ZONE
        value: Asia/Ho_Chi_Minh
      - key: FILE_STORAGE_TYPE
        value: local
      - key: FILE_STORAGE_LOCAL_ROOT
        value: /var/lib/schedule-manager/uploads
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"

databases:
  - name: schedule-manager-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: schedule_manager
    user: schedule_app
    ipAllowList: []
