name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Validate production config fixture
        run: npm run release:validate-config -- --env-file tests/config/production-config.valid.env
      - name: Reject production placeholders
        run: |
          if npm run release:validate-config -- --env-file .env.production.example --skip-compose; then
            echo "Expected placeholder production configuration to be rejected"
            exit 1
          fi

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose --project-name schedule-manager-ci-e2e --file compose.e2e.yaml up --detach --build --wait
      - run: npm run test:e2e
        env:
          E2E_FULL_STACK: "true"
          E2E_API_BASE_URL: http://localhost:18080/api/v1
          E2E_WEB_BASE_URL: http://localhost:3100
          E2E_EXTERNAL_WEB: "true"
      - if: always()
        run: docker compose --project-name schedule-manager-ci-e2e --file compose.e2e.yaml down --volumes --remove-orphans

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn --batch-mode --file backend/pom.xml verify

  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose --project-name schedule-manager-ci-performance --file compose.e2e.yaml up --detach --build --wait postgres-e2e backend-e2e
      - run: docker compose --project-name schedule-manager-ci-performance --file compose.e2e.yaml --profile performance run --rm performance
      - if: failure()
        run: docker compose --project-name schedule-manager-ci-performance --file compose.e2e.yaml logs --no-color --tail 300 backend-e2e
      - if: always()
        run: docker compose --project-name schedule-manager-ci-performance --file compose.e2e.yaml --profile performance down --volumes --remove-orphans

  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose --project-name schedule-manager-ci-security --file compose.e2e.yaml up --detach --build --wait postgres-e2e backend-e2e frontend-e2e
      - run: >-
          docker run --rm --network schedule-manager-ci-security_default
          --volume "$PWD/tests/security:/zap/config:ro"
          ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          zap-baseline.py -t http://frontend-e2e:3000 -m 1 -T 3 -s -I -c /zap/config/zap-baseline.conf
      - if: always()
        run: docker compose --project-name schedule-manager-ci-security --file compose.e2e.yaml down --volumes --remove-orphans
