services:
  postgres-e2e:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: schedule_manager_e2e
      POSTGRES_USER: schedule_e2e
      POSTGRES_PASSWORD: schedule_e2e_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule_e2e -d schedule_manager_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  mailpit-e2e:
    image: axllent/mailpit@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports:
      - "127.0.0.1:18025:8025"
      - "127.0.0.1:18026:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-e2e:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres-e2e:5432/schedule_manager_e2e
      DB_USER: schedule_e2e
      DB_PASSWORD: schedule_e2e_password
      DB_POOL_MAX_SIZE: "30"
      DB_POOL_MIN_IDLE: "10"
      DB_CONNECTION_TIMEOUT_MS: "5000"
      CORS_ALLOWED_ORIGINS: http://localhost:3100
      SESSION_COOKIE_NAME: schedule_e2e_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_PEPPER: e2e-only-session-pepper-at-least-32-characters
      AUTH_RATE_LIMIT_PER_MINUTE: "100"
      AUTH_RATE_LIMIT_PER_HOUR: "500"
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_EMAIL: admin.e2e@example.edu.vn
      BOOTSTRAP_ADMIN_PASSWORD: AdminE2E@2026
      BOOTSTRAP_ADMIN_DISPLAY_NAME: Quản trị E2E
      BOOTSTRAP_ADMIN_DEPARTMENT_NAME: Văn phòng E2E
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: no-reply.e2e@example.edu.vn
      SMTP_HOST: mailpit-e2e
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      REMINDER_INITIAL_DELAY_MS: "100"
      REMINDER_POLL_DELAY_MS: "250"
      OUTBOX_INITIAL_DELAY_MS: "100"
      OUTBOX_POLL_DELAY_MS: "250"
      FILE_STORAGE_LOCAL_ROOT: /tmp/schedule-manager/uploads
    depends_on:
      postgres-e2e:
        condition: service_healthy
      mailpit-e2e:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s

  frontend-e2e:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:18080/api/v1
    depends_on:
      backend-e2e:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  performance:
    image: grafana/k6@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c
    profiles: ["performance"]
    environment:
      BASE_URL: http://backend-e2e:8080/api/v1
      VUS: ${PERFORMANCE_VUS:-100}
      DURATION: ${PERFORMANCE_DURATION:-30s}
    volumes:
      - ./tests/performance:/scripts:ro
    depends_on:
      backend-e2e:
        condition: service_healthy
    command: ["run", "/scripts/authenticated-read-smoke.js"]
